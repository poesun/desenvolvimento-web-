<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itens - Pokedex</title>
  <link rel="stylesheet" href="/resources/css/iten.css">
  <link rel="stylesheet" href="/resources/css/lateral.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
  <h1>Lista de Itens</h1>
  <ul id="item-list"><li>Carregando...</li></ul>

  <script src="/resources/js/menu.js"></script>
  <script>
    const FIRST_ITEM = 1;
    const LAST_ITEM = 240;   

    const english = (list, key) => list?.find(e => e.language.name === 'en')?.[key];

    async function getItem(id) {
      const resp = await fetch(`https://pokeapi.co/api/v2/item/${id}`);
      if (!resp.ok) throw new Error(`Item ${id}: HTTP ${resp.status}`);
      return resp.json();
    }

    async function loadItems() {
      const ids = Array.from({ length: LAST_ITEM - FIRST_ITEM + 1 }, (_, i) => FIRST_ITEM + i);
      
      const results = await Promise.allSettled(ids.map(getItem));
      const list = document.getElementById('item-list');
      list.innerHTML = '';

      for (const r of results) {
        if (r.status !== 'fulfilled') { console.warn(r.reason); continue; }
        const item = r.value;
        const li = document.createElement('li');

        if (item.sprites?.default) {            
          const img = document.createElement('img');
          img.src = item.sprites.default;
          img.alt = item.name;
          li.appendChild(img);
        }
        const h3 = document.createElement('h3');
        h3.textContent = item.name.replaceAll('-', ' ');
        const p = document.createElement('p');
        p.textContent =
          english(item.effect_entries, 'effect') ||                
          english(item.flavor_text_entries, 'text') ||
          'Sem descrição.';
        li.append(h3, p);
        list.appendChild(li);
      }
    }
    loadItems();
  </script>
</body>
</html>
