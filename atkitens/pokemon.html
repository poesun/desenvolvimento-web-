<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Pokémon</title>
  <link rel="stylesheet" href="/resources/css/pokemon.css">
  <link rel="stylesheet" href="/resources/css/types.css">
  <link rel="stylesheet" href="/resources/css/lateral.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
  <div class="pokemon-details">
    <div class="imgContainer">
      <img alt="Imagem do Pokémon">
    </div>
    <h2 class="name"></h2>

    <div class="stats">
      <div class="stat"><label>Altura:</label> <span class="height"></span></div>
      <div class="stat"><label>Peso:</label> <span class="weight"></span></div>
      <div class="stat"><label>Tipo:</label> <span class="type"></span></div>
      <div class="stat">
        <label>Stats:</label>
        <ul class="pokemon-stats"></ul>
      </div>
      <div class="stat">
        <label>Habilidades:</label>
        <ul class="abilities"></ul>
      </div>
    </div>

    <div class="button-container">
      <button class="back-pokemon-button">Anterior Pokémon</button>
      <button class="next-pokemon-button">Próximo Pokémon</button>
    </div>

    <div class="stat">
      <label>Ataques:</label>
      <ul class="moves"></ul>
      <button class="see-more-button" hidden>Ver mais</button>
      <button class="see-less-button" hidden>Ver menos</button>
    </div>

    <a class="back-button" href="/aaa.html">Voltar</a>
  </div>

  <script src="/resources/js/menu.js"></script>
  <script src="/resources/js/pokemon-detalhes.js"></script>
</body>
</html>
