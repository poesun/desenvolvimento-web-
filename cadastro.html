<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/resources/css/login.css">
    <title>Página de Cadastro</title>
</head>
<body>
    <div class="main-login">
        <div class="left-login">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/International_Pok%C3%A9mon_logo.svg/1200px-International_Pok%C3%A9mon_logo.svg.png" class="left-login-img" alt="Logo Pokémon">
            <h1>Crie sua conta e tenha acesso a pokedex</h1>
        </div>
        <div class="right-login">
            <div class="card-login">
                <h1>Cadastro</h1>
                <form method="post" action="/resources/php/signIn.php">
                    <div class="textfield">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Nome" required>
                    </div>
                    <div class="textfield">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>
                    <div class="textfield">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Senha" minlength="3" required>
                    </div>
                    <button type="submit" class="btn-login" name="submit">Cadastrar</button>
                </form>
                <a class="btn-login btn-logon" href="/index.html">Já tem conta?</a>
            </div>
        </div>
    </div>
</body>
</html>
